[env:paperframe-s3]
platform = espressif32@7.0.0
board = esp32-s3-devkitc-1
framework = espidf

board_build.flash_mode = qio
board_build.f_flash = 80000000L
board_build.flash_size = 16MB
board_build.partitions = partitions/paperframe-dev.csv
board_build.filesystem = littlefs
board_upload.flash_size = 16MB
board_upload.before_reset = usb_reset

monitor_speed = 115200
upload_speed = 460800
upload_protocol = esptool
; pre: regenerates the embedded WebUI so data/web edits reach the firmware
; without a CMake reconfigure (PlatformIO only reconfigures on root/src
; CMakeLists changes). See docs/adr/0016-embed-webui-assets-in-firmware.md.
extra_scripts =
    pre:tools/platformio_web_assets.py
    post:tools/platformio_native_usb_upload.py

[env:native]
platform = native
test_framework = unity
test_build_src = no
build_flags =
    -std=c++17
    -I components/pf_carousel/include
    -I components/pf_auth/include
    -I components/pf_config/include
    -I components/pf_display/include
    -I components/pf_image/include
    -I components/pf_network/include
    -I components/pf_ota/include
    -I components/pf_runtime/include
    -I components/pf_sensors/include
    -I components/pf_storage/include
    -I components/pf_weather/include
    -I components/pf_web/include
; pf_image/pfr1.hpp inflates PFR1's optional compressed payload with system
; zlib on this platform (ESP-IDF builds use the ROM-provided miniz instead,
; see pfr1.hpp) since the native env has no ESP-IDF component graph to link
; ROM symbols against.
    -lz
