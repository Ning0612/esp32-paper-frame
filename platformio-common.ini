[env:paperframe-s3]
platform = espressif32@7.0.0
board = esp32-s3-devkitc-1
framework = espidf

board_build.flash_mode = qio
board_build.f_flash = 80000000L
board_build.flash_size = 16MB
board_build.partitions = partitions/paperframe-dev.csv
board_build.filesystem = littlefs
board_upload.flash_size = 16MB
board_upload.before_reset = usb_reset

monitor_speed = 115200
upload_speed = 460800
upload_protocol = esptool
extra_scripts = post:tools/platformio_native_usb_upload.py

[env:native]
platform = native
test_framework = unity
test_build_src = no
build_flags =
    -std=c++17
    -I components/pf_carousel/include
    -I components/pf_config/include
    -I components/pf_display/include
    -I components/pf_runtime/include
    -I components/pf_web/include
