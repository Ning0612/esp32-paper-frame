name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Set up Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: "22"

      - name: Install development tools
        run: python -m pip install -r requirements-dev.txt

      - name: Run native tests
        run: python -m platformio test -e native

      # Each embedded environment has its own test_filter, so one invocation
      # only ever builds one suite. test_epd7in3e_driver is not covered by any
      # environment's filter at all and needs -f to be compiled -- without
      # these three steps it would never be built in CI.
      - name: Build embedded test environment (runtime coordinator)
        run: >-
          python -m platformio test
          --project-conf platformio-embedded.ini
          -e paperframe-s3-embedded-test
          --without-uploading --without-testing

      - name: Build embedded test environment (display task)
        run: >-
          python -m platformio test
          --project-conf platformio-embedded.ini
          -e paperframe-s3-display-test
          --without-uploading --without-testing

      - name: Build embedded test environment (panel driver)
        run: >-
          python -m platformio test
          --project-conf platformio-embedded.ini
          -e paperframe-s3-embedded-test
          -f test_epd7in3e_driver
          --without-uploading --without-testing

      - name: Check WebUI JavaScript syntax
        shell: bash
        run: |
          for file in data/web/*.js; do
            node --check "$file"
          done

      - name: Run WebUI contract tests
        shell: bash
        run: |
          for test in test/web/*.mjs; do
            node "$test"
          done

      # test/*.mjs sits outside test/web/ and is not picked up by the loop
      # above, nor by `platformio test -e native` (those are Unity suites).
      - name: Run repository contract tests
        shell: bash
        run: |
          for test in test/*.mjs; do
            node "$test"
          done

      - name: Run PlatformIO tooling tests
        run: python test/test_active_ota_upload.py
        env:
          PYTHONPATH: .

      - name: Build ESP32-S3 firmware
        run: python -m platformio run -e paperframe-s3
