name: Release

on:
  push:
    tags:
      - "v*"

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out tagged source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Set up Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: "22"

      - name: Install development tools
        run: python -m pip install -r requirements-dev.txt

      - name: Verify release tag and source branch
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python scripts/verify-release-version.py "$RELEASE_TAG"
          tag_commit="$(git rev-parse "refs/tags/$RELEASE_TAG^{}")"
          if [[ "$tag_commit" != "$GITHUB_SHA" ]]; then
            echo "tag $RELEASE_TAG resolves to $tag_commit, expected $GITHUB_SHA"
            exit 1
          fi
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - name: Run native tests
        run: python -m platformio test -e native

      - name: Build embedded test environment
        run: >-
          python -m platformio test
          --project-conf platformio-embedded.ini
          -e paperframe-s3-embedded-test
          --without-uploading --without-testing

      - name: Check WebUI JavaScript syntax
        shell: bash
        run: |
          for file in data/web/*.js; do
            node --check "$file"
          done

      - name: Run WebUI contract tests
        shell: bash
        run: |
          for test in test/web/*.mjs; do
            node "$test"
          done

      - name: Build firmware
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python -m platformio run -e paperframe-s3
          mkdir -p release-assets
          cp .pio/build/paperframe-s3/firmware.bin \
            release-assets/paperframe-firmware.bin
          cp partitions/paperframe-dev.csv \
            release-assets/paperframe-partitions.csv
          # Bundled as a zip (not flat files) so the LICENSES/OFL-1.1.txt
          # relative link inside ASSET_CREDITS.md/THIRD_PARTY_NOTICES.md
          # still resolves after extraction -- GitHub Release assets have
          # no real directory structure, so flat copies would break it.
          mkdir -p release-assets/licenses-staging/LICENSES
          cp ASSET_CREDITS.md release-assets/licenses-staging/ASSET_CREDITS.md
          cp THIRD_PARTY_NOTICES.md \
            release-assets/licenses-staging/THIRD_PARTY_NOTICES.md
          cp LICENSES/OFL-1.1.txt \
            release-assets/licenses-staging/LICENSES/OFL-1.1.txt
          (
            cd release-assets/licenses-staging
            zip -r ../paperframe-licenses.zip .
          )
          rm -rf release-assets/licenses-staging
          (
            cd release-assets
            sha256sum \
              paperframe-firmware.bin \
              paperframe-partitions.csv \
              paperframe-licenses.zip \
              > SHA256SUMS
          )
          printf '%s\n' \
            '## PaperFrame release assets' \
            '' \
            "- App firmware version/tag: $RELEASE_TAG." \
            '- The WebUI is compiled into paperframe-firmware.bin, so a single OTA updates the firmware and the frontend together.' \
            '- paperframe-firmware.bin is the app image used by device OTA.' \
            '- paperframe-partitions.csv records the partition layout used for this build.' \
            '- paperframe-licenses.zip: third-party asset attribution (weather icon bitmaps converted from erikflowers/weather-icons, SIL OFL-1.1) required to accompany this compiled firmware -- contains ASSET_CREDITS.md, THIRD_PARTY_NOTICES.md, and LICENSES/OFL-1.1.txt.' \
            '- SHA256SUMS contains SHA-256 checksums for the release assets.' \
            '' \
            "- Hardware validation checklist: https://github.com/$GITHUB_REPOSITORY/blob/$RELEASE_TAG/docs/hardware/VALIDATION.md" \
            '- Hardware OTA, rollback, power-loss recovery, TLS, and heap high-water-mark validation remain manual.' \
            > release-assets/release-notes.md

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          notes="$(cat release-assets/release-notes.md)"
          assets=(
            release-assets/paperframe-firmware.bin
            release-assets/paperframe-partitions.csv
            release-assets/paperframe-licenses.zip
            release-assets/SHA256SUMS
          )
          release_args=(
            --verify-tag
            --generate-notes
            --notes "$notes"
            --title "$RELEASE_TAG"
          )
          if [[ "$RELEASE_TAG" == *-* ]]; then
            release_args+=(--prerelease --latest=false)
          fi
          if draft_state="$(gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft' 2>/dev/null)"; then
            if [[ "$draft_state" != "true" ]]; then
              echo "release $RELEASE_TAG already exists and is published; refusing to overwrite"
              exit 1
            fi
            gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber
            edit_args=(
              --draft=false
              --verify-tag
              --title "$RELEASE_TAG"
              --notes "$notes"
            )
            if [[ "$RELEASE_TAG" == *-* ]]; then
              edit_args+=(--prerelease --latest=false)
            else
              edit_args+=(--prerelease=false)
            fi
            gh release edit "$RELEASE_TAG" "${edit_args[@]}"
          else
            gh release create "$RELEASE_TAG" \
              "${assets[@]}" \
              "${release_args[@]}"
          fi
