<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#f3efdf">
  <title>PaperFrame 配網</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/style.css">
  <script src="/ui.js" defer></script>
</head>
<body>
  <div class="color-rail" aria-hidden="true">
    <i></i><i></i><i></i><i></i><i></i><i></i>
  </div>
  <main class="sheet">
    <header class="masthead">
      <div>
        <p class="eyebrow">PAPERFRAME / LOCAL SETUP</p>
        <h1>讓畫框<br>找到你的網路</h1>
      </div>
      <div class="step-stamp" aria-label="步驟 1，共 1 步">
        <b>01</b>
        <span>連線設定</span>
      </div>
    </header>

    <section class="intro" aria-labelledby="setup-title">
      <p id="setup-title">
        目前連線到裝置自己的 Wi‑Fi。選擇家中網路後，PaperFrame
        會保存設定並重新啟動。
      </p>
      <span class="offline-badge">完全離線可用</span>
    </section>

    <form id="wifi-form" class="setup-grid" novalidate>
      <section class="panel network-panel">
        <div class="panel-heading">
          <div>
            <span class="panel-no">A</span>
            <h2>選擇 Wi‑Fi</h2>
          </div>
          <button id="scan-button" class="scan-button" type="button">
            重新掃描
          </button>
        </div>

        <p id="scan-status" class="status-line" role="status" aria-live="polite">
          準備掃描附近網路
        </p>
        <div id="network-list" class="network-list" role="radiogroup"
             aria-label="附近 Wi‑Fi"></div>

        <label class="manual-toggle">
          <input id="manual-toggle" type="checkbox">
          <span>我的網路沒有出現在清單中</span>
        </label>
        <label id="manual-field" class="field manual-field" hidden>
          <span>網路名稱（SSID）</span>
          <input id="manual-ssid" maxlength="32" autocomplete="off">
        </label>
      </section>

      <section class="panel credential-panel">
        <div class="panel-heading">
          <div>
            <span class="panel-no">B</span>
            <h2>輸入密碼</h2>
          </div>
        </div>

        <div class="selected-network">
          <span>將連線至</span>
          <strong id="selected-ssid">尚未選擇</strong>
        </div>

        <label class="field">
          <span>Wi‑Fi 密碼</span>
          <div class="password-row">
            <input id="password" name="password" type="password"
                   maxlength="63" autocomplete="new-password">
            <button id="password-toggle" type="button"
                    aria-pressed="false">顯示</button>
          </div>
          <small>加密網路需 8–63 字元；開放網路可留白。</small>
        </label>

        <aside class="trust-note">
          <b>只留在裝置裡</b>
          <p>密碼不會放進網址、畫面回應或系統紀錄。</p>
        </aside>

        <button id="save-button" class="save-button" type="submit">
          儲存並重新啟動
        </button>
        <p id="save-status" class="save-status" role="status"
           aria-live="assertive"></p>
      </section>
    </form>

    <footer>
      <span>PaperFrame Setup</span>
      <span>192.168.4.1</span>
      <span>僅限可信任 LAN 或裝置 AP</span>
    </footer>
  </main>
</body>
</html>
